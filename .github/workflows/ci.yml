name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-runs the checks and redeploys main by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:packs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm crap
      - run: pnpm build

  # Full games against the real Worker, Room Durable Object and a local D1.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload traces and videos from failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

  # Merging to main deploys straight to production once every check passes.
  # Forks without a CLOUDFLARE_ACCOUNT_ID repository variable skip this job.
  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://openpartygames.org
    # Never run two deploys at once, and never cancel one halfway through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Migrations run before the new Worker, so they must stay compatible with the version still live.
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply openpartygames --remote
      - name: Seed content packs
        working-directory: apps/worker
        run: |
          node ../../scripts/build-pack-seed.mjs
          pnpm exec wrangler d1 execute openpartygames --remote --file=.wrangler/pack-seed.sql
      - name: Deploy the Worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
      - name: Check the live site
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors https://openpartygames.org/api/health
