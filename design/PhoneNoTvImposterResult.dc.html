<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 27px; line-height: 1.1;">Imposter</div>
      <div style="font-size: 16px; font-weight: 700; color: #4A4A4A;">Word 3 of 6</div>
    </div>
    <div style="padding: 3px 16px; background: #FFFFFF; border: 4px solid #D7372B; border-radius: 22px 8px 18px 10px / 10px 18px 8px 22px; transform: rotate(-6deg); font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 22px; line-height: 1.1; color: #D7372B;">Nope</div>
  </div>

  <!-- STAGE: the word, the imposter's guess, who the imposter was, and standings. The verdict
       already landed by this beat -- letter flips and the slam are done -- so on a silent, no-buzz
       phone every fact here has to be legible as text and shape, not just as a settled animation. -->
  <div style="box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 34px 10px 30px 12px / 12px 30px 10px 34px; transform: rotate(0.6deg);">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 16px; font-weight: 700; color: #555555;">The word was</div>
      <div style="align-self: flex-start; position: relative; padding: 0 8px;">
        <div style="position: absolute; left: 0; right: 0; top: 44%; height: 50%; background: #FFE45C; border-radius: 8px; transform: rotate(-2deg);"></div>
        <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 46px; line-height: 1.1;">Giraffe</div>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; font-size: 17px;">
      <div style="font-weight: 400;">Priya guessed</div>
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 24px; line-height: 1.1;">Horse</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #FFF6BF; border: 3px solid #2B2B2B; border-radius: 22px 8px 18px 10px / 10px 18px 8px 22px;">
      <svg width="36" height="36" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="6" fill="#2B2B2B"></circle></svg>
      <div style="font-size: 16px; font-weight: 700;">Priya was the imposter, caught, wrong guess</div>
    </div>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 2px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
    <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 24px; line-height: 1.1; margin-bottom: 6px;">
      <div style="position: absolute; left: 84px; top: -6px; width: 96px; height: 26px; background: rgba(255, 228, 92, 0.8); transform: rotate(-3deg); z-index: 0;"></div>
      <div style="position: relative; z-index: 1;">Standings</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 42px;">
      <div style="width: 20px; font-size: 16px; font-weight: 700; color: #555555;">1</div>
      <svg width="32" height="32" viewBox="0 0 100 100"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 700;">Maya</div>
      <div style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">1,500</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 42px;">
      <div style="width: 20px; font-size: 16px; font-weight: 700; color: #555555;">1</div>
      <svg width="32" height="32" viewBox="0 0 100 100"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 700;">Dov</div>
      <div style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">1,500</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 42px;">
      <div style="width: 20px; font-size: 16px; font-weight: 700; color: #555555;">3</div>
      <svg width="32" height="32" viewBox="0 0 100 100"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 700;">Sam</div>
      <div style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">1,000</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 42px;">
      <div style="width: 20px; font-size: 16px; font-weight: 700; color: #555555;">3</div>
      <svg width="32" height="32" viewBox="0 0 100 100"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 700;">Noa</div>
      <div style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">1,000</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 42px; background: #FFF6BF; border-radius: 16px 6px 14px 8px / 8px 14px 6px 16px; padding: 0 6px;">
      <div style="width: 20px; font-size: 16px; font-weight: 700; color: #555555;">3</div>
      <svg width="32" height="32" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 700;">Priya (you)</div>
      <div style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">1,000</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 42px;">
      <div style="width: 20px; font-size: 16px; font-weight: 700; color: #555555;">6</div>
      <svg width="32" height="32" viewBox="0 0 100 100"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 700;">Leo</div>
      <div style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">500</div>
    </div>
  </div>

  <!-- CONTROLS: your points this word -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #FFE45C; box-shadow: 0 6px 12px rgba(43, 43, 43, 0.14); transform: rotate(-1deg);">
    <div style="display: flex; flex-direction: column;">
      <div style="font-size: 18px; font-weight: 700;">Priya (you)</div>
      <div style="font-size: 16px; font-weight: 400;">Caught, wrong guess</div>
    </div>
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1;">+0</div>
  </div>

</div>
</x-dc>
</body>
</html>
