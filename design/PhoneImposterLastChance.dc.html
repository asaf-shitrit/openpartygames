<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1.1;">Imposter</div>
      <div style="font-size: 17px; font-weight: 700; color: #4A4A4A;">Last chance</div>
    </div>
    <div style="width: 78px; height: 78px; position: relative; display: flex; align-items: center; justify-content: center;">
      <svg width="78" height="78" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
      <div style="position: relative; font-size: 22px; font-weight: 700;">0:11</div>
    </div>
  </div>

  <div style="flex-grow: 1; margin-top: 8px; padding: 24px 20px 24px 56px; display: flex; flex-direction: column; justify-content: center; gap: 18px; background-color: #FFFFFF; background-image: linear-gradient(90deg, transparent 38px, #F2A3A3 38px, #F2A3A3 40px, transparent 40px), repeating-linear-gradient(transparent 0, transparent 36px, #D6E4F5 36px, #D6E4F5 38px); border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(1deg);">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 40px; line-height: 1.15; color: #D7372B; transform: rotate(-3deg);">You got caught!</div>
    <div style="font-size: 20px; font-weight: 700; line-height: 1.4; text-wrap: pretty;">Guess the crew's word. Get it right and you steal 1,000 points.</div>
    <div style="display: flex; align-items: baseline; gap: 8px; font-size: 19px;">
      <div style="font-weight: 400;">Your decoy was</div>
      <div style="position: relative; padding: 0 6px;">
        <div style="position: absolute; left: 0; right: 0; top: 40%; height: 55%; background: #FFE45C; border-radius: 6px; transform: rotate(-2deg);"></div>
        <div style="position: relative; font-weight: 700; letter-spacing: 0.04em;">ZEBRA</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 17px; font-weight: 700;">Your guess</div>
    <div style="height: 66px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 2px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
      <div style="font-size: 26px; font-weight: 700;">horse</div>
      <div style="width: 3px; height: 32px; background: #2B2B2B;"></div>
    </div>
  </div>

  <div style="height: 60px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2B2B2B; color: #FBF8F1; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 21px; font-weight: 700;">
    <div>Submit guess</div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="50" height="50" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="6" fill="#2B2B2B"></circle></svg>
    <div style="font-size: 21px; font-weight: 700;">Priya</div>
  </div>

</div>
</x-dc>
</body>
</html>
