<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1.1;">Imposter</div>
      <div style="font-size: 17px; font-weight: 700; color: #4A4A4A;">Word 3 of 6</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="44" height="44" viewBox="0 0 100 100"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="41" cy="55" r="5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
      <div style="font-size: 20px; font-weight: 700;">Dov</div>
    </div>
  </div>

  <div style="flex-grow: 1; margin: 6px 4px 0; padding: 28px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #FFE45C; box-shadow: 0 6px 12px rgba(43, 43, 43, 0.14); transform: rotate(-1.5deg);">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1.1; text-align: center;">Your turn!</div>
    <div style="font-size: 22px; font-weight: 700; line-height: 1.3; text-align: center;">Say one clue out loud.</div>
    <div style="width: 150px; height: 150px; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 8px;">
      <svg width="150" height="150" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"></path></svg>
      <div style="position: relative; font-size: 40px; font-weight: 700;">0:24</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 8px 8px 8px 18px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
    <div style="flex-grow: 1; display: flex; align-items: baseline; gap: 8px; font-size: 19px;">
      <div style="font-weight: 400;">Your word:</div>
      <div style="font-weight: 700; letter-spacing: 0.04em;">GIRAFFE</div>
    </div>
    <div style="height: 44px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 6px; background: #FBF8F1; border: 3px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 17px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c5.5 0 9 5.5 9 7a11 11 0 0 1-2.6 3.4M6.3 6.3C4.2 7.7 3 10.3 3 12c0 1.5 3.5 7 9 7 1.8 0 3.3-.5 4.6-1.3"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
      <div>Hide</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2B2B2B; color: #FBF8F1; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 22px; font-weight: 700;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      <div>I'm done</div>
    </div>
    <div style="font-size: 17px; font-weight: 400; color: #555555; text-align: center;">Passes to Priya</div>
  </div>

</div>
</x-dc>
</body>
</html>
