<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 28px; line-height: 1.1;">Doodle Bluff</div>
      <div style="font-size: 17px; font-weight: 700; color: #4A4A4A;">Drawing 1 of 2</div>
    </div>
    <div style="width: 78px; height: 78px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="78" height="78" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
      <div style="position: relative; font-size: 22px; font-weight: 700;">1:04</div>
    </div>
  </div>

  <div role="tablist" aria-label="Which drawing" style="display: flex; gap: 10px; height: 44px;">
    <div role="tab" aria-selected="true" style="flex: 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #2B2B2B; color: #FBF8F1; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 17px; font-weight: 700;">
      <div>Drawing 1</div>
    </div>
    <div role="tab" aria-selected="false" style="flex: 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #FFFFFF; color: #2B2B2B; border: 4px solid #2B2B2B; border-radius: 12px 22px 10px 26px / 26px 10px 22px 12px; font-size: 17px; font-weight: 700;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2.6"><circle cx="12" cy="12" r="9"></circle></svg>
      <div>Drawing 2</div>
    </div>
  </div>

  <div style="position: relative; height: 72px; box-sizing: border-box; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 3px; background: #FFE45C; box-shadow: 0 6px 12px rgba(43, 43, 43, 0.14); transform: rotate(-1deg);">
    <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5A00;">Draw this — no words</div>
    <div style="font-size: 21px; font-weight: 700; line-height: 1.2;">a cat riding a skateboard</div>
  </div>

  <div role="img" aria-label="Your drawing for a cat riding a skateboard: 7 strokes so far" style="position: relative; width: 354px; height: 354px; box-sizing: border-box; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; touch-action: none;">
    <svg width="354" height="354" viewBox="0 0 300 300" style="position: absolute; left: 0; top: 0;">
      <path d="M42 234c66-14 130-9 210-16" fill="none" stroke="#2F6FB5" stroke-width="9" stroke-linecap="round"></path>
      <circle cx="68" cy="243" r="11" fill="#2B2B2B"></circle>
      <circle cx="228" cy="228" r="11" fill="#2B2B2B"></circle>
      <path d="M108 205c-14-32 8-63 47-66c37-3 62 20 57 54c-4 26-29 41-58 40c-28-1-50-14-46-28z" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M118 202l-6 28M150 210l-2 26M182 206l6 26" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"></path>
      <path d="M96 176c-16-6-28-20-24-30" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"></path>
      <path d="M186 130a24 24 0 1 1 -14 -22" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"></path>
      <circle cx="192" cy="107" r="4" fill="#D7372B"></circle>
    </svg>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px;">
    <button type="button" title="Ink pen" aria-label="Ink pen" style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #2B2B2B; background: #2B2B2B; padding: 0;"></button>
    <button type="button" title="Red pen" aria-label="Red pen" style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #2B2B2B; background: #D7372B; padding: 0;"></button>
    <div style="position: relative; width: 48px; height: 48px;">
      <button type="button" title="Blue pen — selected" aria-label="Blue pen, selected" style="width: 48px; height: 48px; border-radius: 50%; border: 5px solid #2B2B2B; background: #2F6FB5; padding: 0; box-shadow: 0 0 0 3px #FBF8F1, 0 0 0 6px #2B2B2B;"></button>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: -4px; bottom: -4px; background: #D7372B; border-radius: 50%; padding: 2px;"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
    </div>
    <button type="button" title="Green pen" aria-label="Green pen" style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #2B2B2B; background: #1E8449; padding: 0;"></button>
    <button type="button" title="Orange pen" aria-label="Orange pen" style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #2B2B2B; background: #C96A15; padding: 0;"></button>
    <button type="button" title="Purple pen" aria-label="Purple pen" style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #2B2B2B; background: #7A4FBF; padding: 0;"></button>
  </div>

  <div style="display: flex; gap: 12px; height: 48px;">
    <div style="flex: 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 18px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
      <div>Undo</div>
    </div>
    <div style="flex: 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 22px 10px 26px / 26px 10px 22px 12px; font-size: 18px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg>
      <div>Clear</div>
    </div>
  </div>

  <button type="button" style="height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255, 255, 255, 0.6); border: 3px dashed #8A8A8A; border-radius: 22px 10px 18px 10px / 10px 18px 10px 22px; font-size: 16px; font-weight: 700; color: #555555;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-6 4 6 7 0s4 6 7 0s2 4 2 4"></path></svg>
    <div>Can't draw? Send a squiggle</div>
  </button>

</div>
</x-dc>
</body>
</html>
