<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 44px 72px 40px; display: flex; flex-direction: column; gap: 28px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 48px 48px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 52px; line-height: 1.1;">Imposter</div>
      <div style="font-size: 30px; font-weight: 700; line-height: 1.2; color: #555555;">Word 3 of 6</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 68px; box-sizing: border-box; padding: 0 26px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 28px;">
        <div style="font-weight: 400; color: #555555;">Room</div>
        <div style="font-weight: 700;">BKTZ</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 68px; box-sizing: border-box; padding: 0 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 34px 10px 30px 12px / 12px 30px 10px 34px; font-size: 28px; font-weight: 700;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path><path d="M19 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        <div>Sound on</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1fr) 640px; gap: 64px; align-items: start;">

    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 64px; line-height: 1.1;">The word was</div>
      <div style="align-self: flex-start; position: relative; padding: 0 20px;">
        <div style="position: absolute; left: 0; right: 0; top: 44%; height: 50%; background: #FFE45C; border-radius: 10px; transform: rotate(-2deg);"></div>
        <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 150px; line-height: 1.1; letter-spacing: 0.02em;">Giraffe</div>
      </div>
      <div style="display: flex; align-items: center; gap: 22px;">
        <div style="font-size: 44px; font-weight: 700;">Priya guessed</div>
        <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 56px; line-height: 1.1;">Horse</div>
        <div style="padding: 2px 20px; border: 5px solid #D7372B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; transform: rotate(-6deg); font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 46px; line-height: 1.1; color: #D7372B;">Nope</div>
      </div>

      <div style="margin-top: 10px; padding: 30px 40px 32px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
        <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1.1;">Points this word</div>

        <div style="display: flex; align-items: center; gap: 20px; min-height: 76px;">
          <div style="display: flex; align-items: center; gap: 4px; width: 264px;">
            <svg width="62" height="62" viewBox="0 0 100 100"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="46" r="5" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="5" fill="#2B2B2B"></circle><path d="M37 62q13 12 26 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
            <svg width="62" height="62" viewBox="0 0 100 100"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="41" cy="55" r="4.5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="4.5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
            <svg width="62" height="62" viewBox="0 0 100 100"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><path d="M35 60q6 5 12 0M57 60q6 5 12 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path><circle cx="52" cy="72" r="4" fill="#2B2B2B"></circle></svg>
            <svg width="62" height="62" viewBox="0 0 100 100"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="43" cy="50" r="4" fill="#2B2B2B"></circle><circle cx="57" cy="50" r="4" fill="#2B2B2B"></circle><path d="M44 59q6 9 12 0z" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"></path></svg>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column;">
            <div style="font-size: 34px; font-weight: 700; line-height: 1.2;">Maya, Dov, Sam, Noa</div>
            <div style="font-size: 30px; font-weight: 400; line-height: 1.2; color: #555555;">spotted Priya</div>
          </div>
          <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 46px; line-height: 1;">+500 each</div>
        </div>

        <div style="display: flex; align-items: center; gap: 20px; min-height: 76px;">
          <div style="display: flex; align-items: center; width: 264px;">
            <svg width="62" height="62" viewBox="0 0 100 100"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="58" r="4.5" fill="#2B2B2B"></circle><circle cx="62" cy="58" r="4.5" fill="#2B2B2B"></circle><path d="M44 70l6 5 6-5" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column;">
            <div style="font-size: 34px; font-weight: 700; line-height: 1.2;">Leo</div>
            <div style="font-size: 30px; font-weight: 400; line-height: 1.2; color: #555555;">voted Dov</div>
          </div>
          <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 46px; line-height: 1;">+0</div>
        </div>

        <div style="display: flex; align-items: center; gap: 20px; min-height: 76px;">
          <div style="display: flex; align-items: center; width: 264px;">
            <svg width="62" height="62" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="5.5" fill="#2B2B2B"></circle><path d="M42 81q8 5 16 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column;">
            <div style="font-size: 34px; font-weight: 700; line-height: 1.2;">Priya</div>
            <div style="font-size: 30px; font-weight: 400; line-height: 1.2; color: #555555;">caught, wrong guess</div>
          </div>
          <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 46px; line-height: 1;">+0</div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 28px;">
      <div style="position: relative; margin-top: 18px; padding: 36px 40px 34px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(1deg);">
        <div style="position: absolute; left: 220px; top: -24px; width: 190px; height: 46px; background: rgba(255, 228, 92, 0.8); transform: rotate(-3deg);"></div>
        <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 56px; line-height: 1.1; margin-bottom: 8px;">Standings</div>

        <div style="display: flex; align-items: center; gap: 18px; height: 80px;">
          <div style="width: 36px; font-size: 32px; font-weight: 700; color: #555555;">1</div>
          <svg width="64" height="64" viewBox="0 0 100 100"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="46" r="5" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="5" fill="#2B2B2B"></circle><path d="M37 62q13 12 26 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
          <div style="flex-grow: 1; font-size: 36px; font-weight: 700;">Maya</div>
          <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">1,500</div>
        </div>

        <div style="display: flex; align-items: center; gap: 18px; height: 80px;">
          <div style="width: 36px; font-size: 32px; font-weight: 700; color: #555555;">1</div>
          <svg width="64" height="64" viewBox="0 0 100 100"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="41" cy="55" r="4.5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="4.5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
          <div style="flex-grow: 1; font-size: 36px; font-weight: 700;">Dov</div>
          <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">1,500</div>
        </div>

        <div style="display: flex; align-items: center; gap: 18px; height: 80px;">
          <div style="width: 36px; font-size: 32px; font-weight: 700; color: #555555;">3</div>
          <svg width="64" height="64" viewBox="0 0 100 100"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><path d="M35 60q6 5 12 0M57 60q6 5 12 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path><circle cx="52" cy="72" r="4" fill="#2B2B2B"></circle></svg>
          <div style="flex-grow: 1; font-size: 36px; font-weight: 700;">Sam</div>
          <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">1,000</div>
        </div>

        <div style="display: flex; align-items: center; gap: 18px; height: 80px;">
          <div style="width: 36px; font-size: 32px; font-weight: 700; color: #555555;">3</div>
          <svg width="64" height="64" viewBox="0 0 100 100"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="43" cy="50" r="4" fill="#2B2B2B"></circle><circle cx="57" cy="50" r="4" fill="#2B2B2B"></circle><path d="M44 59q6 9 12 0z" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"></path></svg>
          <div style="flex-grow: 1; font-size: 36px; font-weight: 700;">Noa</div>
          <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">1,000</div>
        </div>

        <div style="display: flex; align-items: center; gap: 18px; height: 80px;">
          <div style="width: 36px; font-size: 32px; font-weight: 700; color: #555555;">3</div>
          <svg width="64" height="64" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="5.5" fill="#2B2B2B"></circle><path d="M42 81q8 5 16 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
          <div style="flex-grow: 1; font-size: 36px; font-weight: 700;">Priya</div>
          <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">1,000</div>
        </div>

        <div style="display: flex; align-items: center; gap: 18px; height: 80px;">
          <div style="width: 36px; font-size: 32px; font-weight: 700; color: #555555;">6</div>
          <svg width="64" height="64" viewBox="0 0 100 100"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="58" r="4.5" fill="#2B2B2B"></circle><circle cx="62" cy="58" r="4.5" fill="#2B2B2B"></circle><path d="M44 70l6 5 6-5" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="flex-grow: 1; font-size: 36px; font-weight: 700;">Leo</div>
          <div style="font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums;">500</div>
        </div>
      </div>

      <div style="align-self: flex-end; display: flex; align-items: center; gap: 16px; padding: 18px 28px; background: #FFE45C; box-shadow: 0 6px 12px rgba(43, 43, 43, 0.14); transform: rotate(-1.5deg);">
        <div style="font-size: 36px; font-weight: 700;">Word 4 starts in</div>
        <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1;">0:05</div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
