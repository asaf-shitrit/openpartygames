<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 44px 72px 40px; display: flex; flex-direction: column; gap: 28px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 48px 48px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 52px; line-height: 1.1;">Imposter</div>
      <div style="font-size: 30px; font-weight: 700; line-height: 1.2; color: #555555;">Word 3 of 6</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 68px; box-sizing: border-box; padding: 0 26px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 28px;">
        <div style="font-weight: 400; color: #555555;">Room</div>
        <div style="font-weight: 700;">BKTZ</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 68px; box-sizing: border-box; padding: 0 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 34px 10px 30px 12px / 12px 30px 10px 34px; font-size: 28px; font-weight: 700;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path><path d="M19 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        <div>Sound on</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 48px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 112px; line-height: 1.1;">Last chance, Priya!</div>
      <div style="max-width: 1500px; font-size: 44px; font-weight: 700; line-height: 1.25; text-wrap: pretty;">15 seconds to guess the crew's word. A right guess steals 1,000 points.</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 140px;">

      <div style="position: relative; padding: 44px 64px 40px; display: flex; flex-direction: column; align-items: center; gap: 20px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; transform: rotate(-1.5deg);">
        <div style="position: absolute; left: 50%; top: -24px; margin-left: -100px; width: 200px; height: 46px; background: rgba(255, 228, 92, 0.8); transform: rotate(-3deg);"></div>
        <svg width="320" height="320" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="5.5" fill="#2B2B2B"></circle><path d="M42 81q8 5 16 0" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
        <div style="display: flex; align-items: center; gap: 16px;">
          <svg width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 56l4-14 32-32a6 6 0 0 1 9 9L25 51z"></path><path d="M42 16l9 9"></path><path d="M12 56l13-5"></path><path d="M38 64c6-4 10 2 16-2s8 2 12-1"></path></svg>
          <div style="font-size: 46px; font-weight: 700;">Priya is typing…</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <div style="width: 260px; height: 260px; position: relative; display: flex; align-items: center; justify-content: center;">
          <svg width="260" height="260" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"></path></svg>
          <div style="position: relative; font-size: 76px; font-weight: 700;">0:11</div>
        </div>
        <div style="font-size: 34px; font-weight: 700; color: #555555;">Seconds left</div>
      </div>

    </div>

  </div>

</div>
</x-dc>
</body>
</html>
