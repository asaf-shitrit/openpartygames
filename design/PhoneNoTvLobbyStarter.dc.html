<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="align-self: flex-start; position: relative; padding: 0 6px;">
    <div style="position: absolute; left: 0; right: 0; bottom: 3px; height: 10px; background: #FFE45C; border-radius: 4px; transform: rotate(-1deg);"></div>
    <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 20px; line-height: 1.2;">You made a room!</div>
  </div>

  <div style="position: relative; padding: 26px 10px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; transform: rotate(-0.6deg); overflow: hidden;">
    <div style="position: absolute; left: 30px; top: -20px; width: 150px; height: 40px; background: rgba(255, 228, 92, 0.85); transform: rotate(-3deg);"></div>
    <div style="font-size: 17px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #555555;">Your room code</div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 62px; line-height: 1;">
      <div>B</div><div style="color: #D7372B; font-size: 32px;">&middot;</div><div>K</div><div style="color: #D7372B; font-size: 32px;">&middot;</div><div>T</div><div style="color: #D7372B; font-size: 32px;">&middot;</div><div>Z</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path></svg>
      <div style="font-size: 19px; font-weight: 700;">Say this out loud</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 22px; line-height: 1.15;">Who's joined (3)</div>
    <div style="padding: 0 14px; display: flex; flex-direction: column; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">

      <div style="height: 50px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; border-bottom: 2px dashed #8A8A8A;">
        <svg width="36" height="36" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path><circle cx="38" cy="46" r="6" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="6" fill="#2B2B2B"></circle><path d="M37 62q13 12 26 0" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"></path></svg>
        <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Maya (you)</div>
        <div style="height: 24px; display: flex; align-items: center; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 17px; line-height: 1; color: #D7372B;">VIP</div>
      </div>

      <div style="height: 50px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; border-bottom: 2px dashed #8A8A8A;">
        <svg width="36" height="36" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path><circle cx="41" cy="55" r="5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"></path></svg>
        <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Dov</div>
      </div>

      <div style="height: 50px; box-sizing: border-box; display: flex; align-items: center; gap: 10px;">
        <svg width="36" height="36" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path><circle cx="50" cy="58" r="14" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5"></circle><circle cx="53" cy="59" r="6" fill="#2B2B2B"></circle></svg>
        <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Priya</div>
      </div>

    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px;">
    <div style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2B2B2B; color: #FBF8F1; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 21px; font-weight: 700;">
      <div>Pick a game</div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
    </div>
    <div style="text-align: center; font-size: 16px; font-weight: 700; color: #555555;">3 players here &middot; ready when you are</div>
  </div>

</div>
</x-dc>
</body>
</html>
