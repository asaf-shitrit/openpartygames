<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="align-self: flex-start; position: relative; padding: 0 6px;">
    <div style="position: absolute; left: 0; right: 0; bottom: 3px; height: 12px; background: #FFE45C; border-radius: 4px; transform: rotate(-1deg);"></div>
    <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 24px; line-height: 1.2;">OpenPartyGames</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px;">

    <div style="position: relative; padding: 30px 22px 24px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; transform: rotate(-1deg);">
      <div style="position: absolute; left: 110px; top: -20px; width: 150px; height: 40px; background: rgba(255, 228, 92, 0.8); transform: rotate(-3deg);"></div>
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 40px; line-height: 1.1;">Join a game</div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #555555;">Room code</div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
          <div style="height: 72px; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 44px; line-height: 1;">B</div>
          <div style="height: 72px; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 44px; line-height: 1;">K</div>
          <div style="height: 72px; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 44px; line-height: 1;">T</div>
          <div style="height: 72px; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 44px; line-height: 1;">Z</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: #555555;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
          <div>It's on the TV</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #555555;">Your name</div>
        <div style="height: 60px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 2px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 22px; font-weight: 700;">
          <div>Priya</div>
          <div style="width: 3px; height: 28px; background: #D7372B;"></div>
        </div>
      </div>

      <div style="height: 60px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2B2B2B; color: #FBF8F1; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 21px; font-weight: 700;">
        <div>Join</div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="text-align: center; font-size: 17px; font-weight: 700; color: #555555;">No account needed.</div>
  </div>

</div>
</x-dc>
</body>
</html>
