<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="align-self: flex-start; position: relative; padding: 0 10px;">
      <div style="position: absolute; left: 0; right: 0; top: 44%; height: 50%; background: #FFE45C; border-radius: 8px; transform: rotate(-2deg);"></div>
      <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 32px; line-height: 1.15;">You're in!</div>
    </div>
    <div style="height: 48px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 20px; flex-shrink: 0;">
      <div style="font-weight: 400; color: #555555;">Room</div>
      <div style="font-weight: 700;">BKTZ</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #FFE45C; box-shadow: 0 6px 12px rgba(43, 43, 43, 0.14); transform: rotate(1deg);">

    <div style="font-size: 19px; font-weight: 700; line-height: 1.35;">Maya is the VIP and picks the game.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 22px; line-height: 1.15;">Maya picked</div>

    <div style="position: relative; padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; transform: rotate(-0.8deg);">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
        <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 34px; line-height: 1.1;">Real or Nah</div>
        <svg width="52" height="52" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="41" cy="55" r="4.5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="4.5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
      </div>
      <div style="font-size: 19px; line-height: 1.35; text-wrap: pretty;">Write fake answers to real facts. Fool your friends, find the truth.</div>
      <div style="font-size: 17px; font-weight: 700; color: #555555;">3&ndash;8 players &middot; about 15 min</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #FFFFFF; border: 4px solid #D7372B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path><path d="M4 4l16 16" stroke="#D7372B"></path></svg>
      <div style="font-size: 20px; font-weight: 700; line-height: 1.3; color: #D7372B;">Plays on a shared screen.</div>
    </div>
    <div style="font-size: 16px; line-height: 1.35; color: #555555;">Maya can pick Imposter or Most Likely To, or add a shared screen.</div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 20px; line-height: 1.15;">Who's here (6)</div>
    <div style="display: flex; align-items: center; gap: -6px;">
      <svg width="42" height="42" viewBox="0 0 100 100" style="margin-right: -8px;"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#FBF8F1" stroke-width="4" stroke-linejoin="round"></path><circle cx="38" cy="46" r="5" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="5" fill="#2B2B2B"></circle></svg>
      <svg width="42" height="42" viewBox="0 0 100 100" style="margin-right: -8px;"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#FBF8F1" stroke-width="4" stroke-linejoin="round"></path><circle cx="41" cy="55" r="4.5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="4.5" fill="#2B2B2B"></circle></svg>
      <svg width="42" height="42" viewBox="0 0 100 100" style="margin-right: -8px;"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#FBF8F1" stroke-width="4" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="5.5" fill="#2B2B2B"></circle></svg>
      <svg width="42" height="42" viewBox="0 0 100 100" style="margin-right: -8px;"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#FBF8F1" stroke-width="4" stroke-linejoin="round"></path><path d="M35 60q6 5 12 0M57 60q6 5 12 0" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
      <svg width="42" height="42" viewBox="0 0 100 100" style="margin-right: -8px;"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#FBF8F1" stroke-width="4" stroke-linejoin="round"></path><circle cx="43" cy="50" r="4" fill="#2B2B2B"></circle><circle cx="57" cy="50" r="4" fill="#2B2B2B"></circle></svg>
      <svg width="42" height="42" viewBox="0 0 100 100"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#FBF8F1" stroke-width="4" stroke-linejoin="round"></path><circle cx="38" cy="58" r="4.5" fill="#2B2B2B"></circle><circle cx="62" cy="58" r="4.5" fill="#2B2B2B"></circle></svg>
    </div>
  </div>

</div>
