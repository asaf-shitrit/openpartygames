<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;">
    <svg width="170" height="170" viewBox="0 0 78 78"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"></path><path d="M35 1l8 5-6 7" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <div style="position: relative; padding: 0 10px;">
      <div style="position: absolute; left: 0; right: 0; top: 48%; height: 44%; background: #FFE45C; border-radius: 8px; transform: rotate(-2deg);"></div>
      <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 40px; line-height: 1.15;">Reconnecting…</div>
    </div>
    <div style="max-width: 300px; font-size: 21px; font-weight: 400; line-height: 1.4; text-wrap: pretty;">Your seat and score are safe. Hang on a sec.</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px;">
      <svg width="50" height="50" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5"></circle><circle cx="53" cy="59" r="6" fill="#2B2B2B"></circle></svg>
      <div style="font-size: 21px; font-weight: 700;">Priya</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 17px; font-weight: 400; line-height: 1.35; color: #555555; text-align: center;">Still stuck after 30 seconds? Reload the page.</div>
    <div style="height: 60px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 21px; font-weight: 700;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg>
      <div>Reload</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
