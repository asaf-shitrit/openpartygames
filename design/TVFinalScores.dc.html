<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 44px 72px 40px; display: flex; flex-direction: column; gap: 28px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 48px 48px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 52px; line-height: 1.1;">Real or Nah</div>
      <div style="font-size: 30px; font-weight: 700; color: #555555;">Final scores</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 68px; box-sizing: border-box; padding: 0 26px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 28px;">
        <div style="font-weight: 400; color: #555555;">Room</div>
        <div style="font-weight: 700;">BKTZ</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 68px; box-sizing: border-box; padding: 0 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 34px 10px 30px 12px / 12px 30px 10px 34px; font-size: 28px; font-weight: 700;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path><path d="M19 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        <div>Sound on</div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 700px minmax(0, 1fr); gap: 64px; flex-grow: 1; align-items: start;">

    <div style="position: relative; margin-top: 22px; padding: 44px 48px 48px; display: flex; flex-direction: column; align-items: center; gap: 16px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; transform: rotate(-1deg);">
      <div style="position: absolute; left: 250px; top: -24px; width: 200px; height: 48px; background: rgba(255, 228, 92, 0.8); transform: rotate(-3deg);"></div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <svg width="170" height="145" viewBox="0 0 40 34" fill="#FFE45C" stroke="#2B2B2B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(-8deg); margin-bottom: -34px; position: relative;"><path d="M5 28l-2-20 10 9 7-13 7 13 10-9-2 20z"></path><circle cx="3" cy="7" r="1.8"></circle><circle cx="20" cy="3.5" r="1.8"></circle><circle cx="37" cy="7" r="1.8"></circle></svg>
        <svg width="260" height="260" viewBox="0 0 100 100"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"></path><circle cx="38" cy="46" r="5" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="5" fill="#2B2B2B"></circle><path d="M37 62q13 12 26 0" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
      </div>
      <div style="position: relative; padding: 0 12px;">
        <div style="position: absolute; left: 0; right: 0; top: 48%; height: 44%; background: #FFE45C; border-radius: 8px; transform: rotate(-1.5deg);"></div>
        <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 76px; line-height: 1.15; text-align: center;">Maya wins the crown!</div>
      </div>
      <div style="font-size: 40px; font-weight: 700;">6,500 points</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 64px; line-height: 1.1;">Final scores</div>
      <div style="display: flex; flex-direction: column; gap: 14px;">

        <div style="display: flex; align-items: center; gap: 22px; padding: 8px 28px; background: #FFF6BF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
          <div style="width: 56px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1; color: #D7372B;">1</div>
          <svg width="72" height="72" viewBox="0 0 100 100"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="46" r="5" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="5" fill="#2B2B2B"></circle><path d="M37 62q13 12 26 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
          <div style="flex-grow: 1; font-size: 40px; font-weight: 700;">Maya</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <svg width="40" height="34" viewBox="0 0 40 34" fill="#FFE45C" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 28l-2-20 10 9 7-13 7 13 10-9-2 20z"></path></svg>
            <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1;">×1</div>
            <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 28px; line-height: 1; color: #D7372B; transform: rotate(-6deg);">new!</div>
          </div>
          <div style="width: 170px; text-align: right; font-size: 40px; font-weight: 700;">6,500</div>
        </div>

        <div style="display: flex; align-items: center; gap: 22px; padding: 8px 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
          <div style="width: 56px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1;">2</div>
          <svg width="72" height="72" viewBox="0 0 100 100"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="41" cy="55" r="4.5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="4.5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
          <div style="flex-grow: 1; font-size: 40px; font-weight: 700;">Dov</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <svg width="40" height="34" viewBox="0 0 40 34" fill="#FFE45C" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 28l-2-20 10 9 7-13 7 13 10-9-2 20z"></path></svg>
            <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1;">×2</div>
          </div>
          <div style="width: 170px; text-align: right; font-size: 40px; font-weight: 700;">6,000</div>
        </div>

        <div style="display: flex; align-items: center; gap: 22px; padding: 8px 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
          <div style="width: 56px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1;">3</div>
          <svg width="72" height="72" viewBox="0 0 100 100"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="58" r="4.5" fill="#2B2B2B"></circle><circle cx="62" cy="58" r="4.5" fill="#2B2B2B"></circle><path d="M44 70l6 5 6-5" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="flex-grow: 1; font-size: 40px; font-weight: 700;">Leo</div>
          <div style="width: 170px; text-align: right; font-size: 40px; font-weight: 700;">4,500</div>
        </div>

        <div style="display: flex; align-items: center; gap: 22px; padding: 8px 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
          <div style="width: 56px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1;">4</div>
          <svg width="72" height="72" viewBox="0 0 100 100"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="43" cy="50" r="4" fill="#2B2B2B"></circle><circle cx="57" cy="50" r="4" fill="#2B2B2B"></circle><path d="M44 59q6 9 12 0z" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"></path></svg>
          <div style="flex-grow: 1; font-size: 40px; font-weight: 700;">Noa</div>
          <div style="width: 170px; text-align: right; font-size: 40px; font-weight: 700;">4,000</div>
        </div>

        <div style="display: flex; align-items: center; gap: 22px; padding: 8px 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
          <div style="width: 56px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1;">5</div>
          <svg width="72" height="72" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="5.5" fill="#2B2B2B"></circle><path d="M42 81q8 5 16 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
          <div style="flex-grow: 1; font-size: 40px; font-weight: 700;">Priya</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <svg width="40" height="34" viewBox="0 0 40 34" fill="#FFE45C" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 28l-2-20 10 9 7-13 7 13 10-9-2 20z"></path></svg>
            <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1;">×1</div>
          </div>
          <div style="width: 170px; text-align: right; font-size: 40px; font-weight: 700;">3,000</div>
        </div>

        <div style="display: flex; align-items: center; gap: 22px; padding: 8px 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
          <div style="width: 56px; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 48px; line-height: 1;">6</div>
          <svg width="72" height="72" viewBox="0 0 100 100"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><path d="M35 60q6 5 12 0M57 60q6 5 12 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path><circle cx="52" cy="72" r="4" fill="#2B2B2B"></circle></svg>
          <div style="flex-grow: 1; font-size: 40px; font-weight: 700;">Sam</div>
          <div style="width: 170px; text-align: right; font-size: 40px; font-weight: 700;">2,000</div>
        </div>

      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 700;">
    <svg width="76" height="44" viewBox="0 0 76 44" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 26c18-10 40-12 64-4"></path><path d="M54 10l16 12-18 10"></path></svg>
    <div style="position: relative; padding: 0 6px;">
      <div style="position: absolute; left: 0; right: 0; bottom: 4px; height: 22px; background: #FFE45C; border-radius: 6px;"></div>
      <div style="position: relative;">Maya</div>
    </div>
    <div>picks the next game from their phone</div>
  </div>

</div>
</x-dc>
</body>
</html>
