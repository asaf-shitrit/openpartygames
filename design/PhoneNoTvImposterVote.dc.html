<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1.1;">Imposter</div>
      <div style="font-size: 17px; font-weight: 700; color: #4A4A4A;">Vote</div>
    </div>
    <div style="width: 64px; height: 64px; position: relative; display: flex; align-items: center; justify-content: center;">
      <svg width="64" height="64" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
      <div style="position: relative; font-size: 19px; font-weight: 700;">0:17</div>
    </div>
  </div>

  <!-- STAGE: who has voted, never whom. A checkmark per player who has locked in; everyone else
       stays plain. No names of picks appear anywhere on this screen. -->
  <div style="box-sizing: border-box; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 22px 8px 20px 10px / 10px 20px 8px 22px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 16px; font-weight: 700; color: #555555; letter-spacing: 0.02em;">WHO HAS VOTED</div>
      <div style="font-size: 16px; font-weight: 700; color: #555555;">3 of 6</div>
    </div>
    <!-- Names dropped, same reasoning as the clue-order strip: six names don't fit at 16px in one
         row, and the avatar plus checkmark badge is the whole signal here -- never whom, just who. -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">

      <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        <svg width="40" height="40" viewBox="0 0 100 100"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path><circle cx="38" cy="46" r="6" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="6" fill="#2B2B2B"></circle></svg>
        <div style="position: absolute; right: -5px; top: -5px; width: 19px; height: 19px; border-radius: 50%; background: #FFF6BF; border: 2.5px solid #D7372B; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></div>
      </div>

      <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        <svg width="40" height="40" viewBox="0 0 100 100"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path><circle cx="41" cy="55" r="6" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="6" fill="#2B2B2B"></circle></svg>
        <div style="position: absolute; right: -5px; top: -5px; width: 19px; height: 19px; border-radius: 50%; background: #FFF6BF; border: 2.5px solid #D7372B; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></div>
      </div>

      <svg width="40" height="40" viewBox="0 0 100 100" style="opacity: 0.5;"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path><circle cx="50" cy="58" r="14" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5"></circle><circle cx="53" cy="59" r="7" fill="#2B2B2B"></circle></svg>

      <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        <svg width="40" height="40" viewBox="0 0 100 100"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>
        <div style="position: absolute; right: -5px; top: -5px; width: 19px; height: 19px; border-radius: 50%; background: #FFF6BF; border: 2.5px solid #D7372B; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></div>
      </div>

      <svg width="40" height="40" viewBox="0 0 100 100" style="opacity: 0.5;"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path><circle cx="43" cy="50" r="5" fill="#2B2B2B"></circle><circle cx="57" cy="50" r="5" fill="#2B2B2B"></circle></svg>

      <svg width="40" height="40" viewBox="0 0 100 100" style="opacity: 0.5;"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"></path></svg>

    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 28px; line-height: 1.15;">Who's the imposter?</div>
    <div style="font-size: 17px; font-weight: 400; line-height: 1.3;">Pick one. You can't vote for yourself.</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">

    <div style="height: 56px; box-sizing: border-box; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
      <svg width="40" height="40" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="46" r="5" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="5" fill="#2B2B2B"></circle><path d="M37 62q13 12 26 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
      <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Maya</div>
      <svg width="26" height="26" viewBox="0 0 30 30"><path d="M16 3c7 0 12 5 11 12 0 7-6 12-12 12C8 27 3 22 3 15 3 8 9 3 17 4" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"></path></svg>
    </div>

    <div style="height: 56px; box-sizing: border-box; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
      <svg width="40" height="40" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="41" cy="55" r="5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
      <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Dov</div>
      <svg width="26" height="26" viewBox="0 0 30 30"><path d="M16 3c7 0 12 5 11 12 0 7-6 12-12 12C8 27 3 22 3 15 3 8 9 3 17 4" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"></path></svg>
    </div>

    <div style="height: 56px; box-sizing: border-box; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 12px; background: #FFF6BF; border: 5px solid #D7372B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-1deg);">
      <svg width="40" height="40" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Sam</div>
      <div style="display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; color: #2B2B2B;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        <div>Your pick</div>
      </div>
    </div>

    <div style="height: 56px; box-sizing: border-box; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
      <svg width="40" height="40" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="43" cy="50" r="4" fill="#2B2B2B"></circle><circle cx="57" cy="50" r="4" fill="#2B2B2B"></circle><path d="M44 59q6 9 12 0z" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Noa</div>
      <svg width="26" height="26" viewBox="0 0 30 30"><path d="M16 3c7 0 12 5 11 12 0 7-6 12-12 12C8 27 3 22 3 15 3 8 9 3 17 4" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"></path></svg>
    </div>

    <div style="height: 56px; box-sizing: border-box; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
      <svg width="40" height="40" viewBox="0 0 100 100" style="flex-shrink: 0;"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="58" r="4.5" fill="#2B2B2B"></circle><circle cx="62" cy="58" r="4.5" fill="#2B2B2B"></circle><path d="M44 70l6 5 6-5" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 19px; font-weight: 700;">Leo</div>
      <svg width="26" height="26" viewBox="0 0 30 30"><path d="M16 3c7 0 12 5 11 12 0 7-6 12-12 12C8 27 3 22 3 15 3 8 9 3 17 4" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"></path></svg>
    </div>

  </div>

  <div style="height: 58px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2B2B2B; color: #FBF8F1; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 20px; font-weight: 700;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <div>Lock in vote</div>
  </div>

</div>
</x-dc>
</body>
</html>
