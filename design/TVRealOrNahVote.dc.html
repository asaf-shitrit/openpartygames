<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 44px 72px 40px; display: flex; flex-direction: column; gap: 28px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 48px 48px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 52px; line-height: 1.1;">Real or Nah</div>
      <div style="font-size: 30px; font-weight: 700; color: #555555;">Fact 2 of 6</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 68px; box-sizing: border-box; padding: 0 26px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 28px;">
        <div style="font-weight: 400; color: #555555;">Room</div>
        <div style="font-weight: 700;">BKTZ</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 68px; box-sizing: border-box; padding: 0 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 34px 10px 30px 12px / 12px 30px 10px 34px; font-size: 28px; font-weight: 700;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path><path d="M19 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        <div>Sound on</div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 48px; align-items: center;">
    <div style="position: relative; margin-top: 10px; padding: 34px 48px 34px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-0.8deg);">
      <div style="position: absolute; left: 640px; top: -22px; width: 180px; height: 44px; background: rgba(255, 228, 92, 0.8); transform: rotate(-3deg);"></div>
      <div style="font-size: 48px; font-weight: 700; line-height: 1.3; text-wrap: pretty;">In 1932, the Australian army went to war against <svg width="220" height="24" viewBox="0 0 300 28" style="vertical-align: -4px;"><path d="M6 18c56-7 118 3 178-3s74 5 110-1" fill="none" stroke="#2B2B2B" stroke-width="8" stroke-linecap="round"></path></svg> and lost.</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="width: 170px; height: 170px; position: relative; display: flex; align-items: center; justify-content: center;">
        <svg width="170" height="170" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"></path></svg>
        <div style="position: relative; font-size: 50px; font-weight: 700;">0:19</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 32px; font-weight: 700;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        <div>4 of 6 voted</div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 28px;">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 68px; line-height: 1.1;">Which one is real?</div>
    <div style="font-size: 38px; font-weight: 700; color: #555555;">Vote on your phone.</div>
  </div>

  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 28px;">
    <div style="width: 420px; min-height: 176px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: center; text-align: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-1.5deg); font-size: 44px; font-weight: 700; line-height: 1.2;">rabbits</div>
    <div style="width: 420px; min-height: 176px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: center; text-align: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(1deg); font-size: 44px; font-weight: 700; line-height: 1.2;">kangaroos</div>
    <div style="width: 420px; min-height: 176px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: center; text-align: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-0.5deg); font-size: 44px; font-weight: 700; line-height: 1.2;">emus</div>
    <div style="width: 420px; min-height: 176px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: center; text-align: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(1.5deg); font-size: 44px; font-weight: 700; line-height: 1.2;">cane toads</div>
    <div style="width: 420px; min-height: 176px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: center; text-align: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(1deg); font-size: 44px; font-weight: 700; line-height: 1.2;">koalas</div>
    <div style="width: 420px; min-height: 176px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: center; text-align: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-1deg); font-size: 44px; font-weight: 700; line-height: 1.2;">dingoes</div>
    <div style="width: 420px; min-height: 176px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: center; text-align: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(1.5deg); font-size: 44px; font-weight: 700; line-height: 1.2;">a swarm of locusts</div>
  </div>

</div>
</x-dc>

</html>
