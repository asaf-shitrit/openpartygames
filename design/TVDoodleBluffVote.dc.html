<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 44px 72px 40px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 48px 48px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 52px; line-height: 1.1;">Doodle Bluff</div>
      <div style="font-size: 30px; font-weight: 700; color: #555555;">Drawing 3 of 6</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 68px; box-sizing: border-box; padding: 0 26px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 28px;">
        <div style="font-weight: 400; color: #555555;">Room</div>
        <div style="font-weight: 700;">BKTZ</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 68px; box-sizing: border-box; padding: 0 28px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 34px 10px 30px 12px / 12px 30px 10px 34px; font-size: 28px; font-weight: 700;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path><path d="M19 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        <div>Sound on</div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 28px;">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 64px; line-height: 1.1;">Which title is real?</div>
    <div style="font-size: 34px; font-weight: 700; color: #555555;">Vote on your phone.</div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 700;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      <div>3 of 5 voted</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: 620px minmax(0, 1fr); gap: 48px; align-items: center;">

    <div style="position: relative; width: 620px; height: 700px; box-sizing: border-box; padding: 26px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; transform: rotate(-0.8deg);">
      <svg width="560" height="560" viewBox="0 0 300 300">
        <path d="M42 234c66-14 130-9 210-16" fill="none" stroke="#2F6FB5" stroke-width="9" stroke-linecap="round"></path>
        <circle cx="68" cy="243" r="11" fill="#2B2B2B"></circle>
        <circle cx="228" cy="228" r="11" fill="#2B2B2B"></circle>
        <path d="M108 205c-14-32 8-63 47-66c37-3 62 20 57 54c-4 26-29 41-58 40c-28-1-50-14-46-28z" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M118 202l-6 28M150 210l-2 26M182 206l6 26" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"></path>
        <path d="M96 176c-16-6-28-20-24-30" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"></path>
        <path d="M164 96c-6-20 12-34 30-30c17 4 24 22 14 36c-9 13-28 15-38 5" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M176 66l-6-12M204 68l7-11" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path>
        <circle cx="180" cy="93" r="3.5" fill="#2B2B2B"></circle>
        <circle cx="200" cy="90" r="3.5" fill="#2B2B2B"></circle>
        <path d="M182 106q8 6 15 0" fill="none" stroke="#D7372B" stroke-width="4" stroke-linecap="round"></path>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="min-height: 100px; box-sizing: border-box; padding: 20px 28px; display: flex; align-items: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-1deg); font-size: 38px; font-weight: 700; line-height: 1.2;">a dog on a scooter</div>
      <div style="min-height: 100px; box-sizing: border-box; padding: 20px 28px; display: flex; align-items: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(0.8deg); font-size: 38px; font-weight: 700; line-height: 1.2;">a squirrel driving a bus</div>
      <div style="min-height: 100px; box-sizing: border-box; padding: 20px 28px; display: flex; align-items: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-0.6deg); font-size: 38px; font-weight: 700; line-height: 1.2;">a hamster in a shopping trolley</div>
      <div style="min-height: 100px; box-sizing: border-box; padding: 20px 28px; display: flex; align-items: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(1.2deg); font-size: 38px; font-weight: 700; line-height: 1.2;">a duck on a unicycle</div>
      <div style="min-height: 100px; box-sizing: border-box; padding: 20px 28px; display: flex; align-items: center; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-1.2deg); font-size: 38px; font-weight: 700; line-height: 1.2;">a cat riding a skateboard</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
