<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="align-self: flex-start; position: relative; padding: 0 6px;">
    <div style="position: absolute; left: 0; right: 0; bottom: 3px; height: 12px; background: #FFE45C; border-radius: 4px; transform: rotate(-1deg);"></div>
    <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 24px; line-height: 1.2;">OpenPartyGames</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px;">

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 40px; line-height: 1.15;">Party games for</div>
      <div style="align-self: flex-start; position: relative; padding: 0 10px;">
        <div style="position: absolute; left: 0; right: 0; top: 44%; height: 50%; background: #FFE45C; border-radius: 8px; transform: rotate(-2deg);"></div>
        <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 40px; line-height: 1.15;">you and your phones</div>
      </div>
    </div>

    <div style="font-size: 19px; line-height: 1.4; text-wrap: pretty; color: #2B2B2B;">Free, open source, no app. Everyone plays from the phone in their pocket.</div>

    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 8px;">

      <div style="position: relative; height: 68px; box-sizing: border-box; padding: 0 26px; display: flex; align-items: center; justify-content: center; gap: 12px; background: #2B2B2B; color: #FBF8F1; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; font-size: 23px; font-weight: 700;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        <div>Start a room</div>
        <div style="position: absolute; right: 22px; top: -16px; width: 130px; height: 34px; background: rgba(255, 228, 92, 0.85); transform: rotate(-3deg); z-index: -1;"></div>
      </div>
      <div style="font-size: 16px; font-weight: 700; color: #555555; text-align: center; margin-top: -6px;">You&rsquo;ll get a code to read out</div>

      <div style="height: 64px; box-sizing: border-box; padding: 0 26px; display: flex; align-items: center; justify-content: center; gap: 12px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 21px; font-weight: 700;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
        <div>Join a room</div>
      </div>

    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #FFFFFF; border: 3px solid #8A8A8A; border-radius: 22px 10px 20px 10px / 10px 20px 10px 22px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
    <div style="font-size: 16px; line-height: 1.3; color: #555555;">Playing with a TV or laptop? Open this page there for the big screen.</div>
  </div>

</div>
</x-dc>
</body>
</html>
