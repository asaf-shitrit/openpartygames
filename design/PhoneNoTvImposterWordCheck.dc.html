<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1.1;">Imposter</div>
      <div style="font-size: 17px; font-weight: 700; color: #4A4A4A;">Word check</div>
    </div>
    <div style="width: 64px; height: 64px; position: relative; display: flex; align-items: center; justify-content: center;">
      <svg width="64" height="64" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
      <div style="position: relative; font-size: 19px; font-weight: 700;">0:06</div>
    </div>
  </div>

  <!-- STAGE: deliberately empty. No tally, no roster, no "look up" prompt -- nothing that could
       suggest holding this phone up for someone else to see. A quiet, intentionally-drawn rest. -->
  <div style="box-sizing: border-box; padding: 18px 16px; display: flex; align-items: center; gap: 14px; background: transparent; border: 3px dashed #8A8A8A; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px;">
    <svg width="30" height="30" viewBox="0 0 30 30" style="flex-shrink: 0;"><circle cx="15" cy="15" r="2.6" fill="#8A8A8A"></circle><circle cx="15" cy="15" r="2.6" fill="#8A8A8A" transform="translate(-9 0)"></circle><circle cx="15" cy="15" r="2.6" fill="#8A8A8A" transform="translate(9 0)"></circle></svg>
    <div style="font-size: 16px; font-weight: 700; color: #555555; line-height: 1.3;">Nothing up here right now — everyone's peeking at their own word.</div>
  </div>

  <div style="flex-grow: 1; margin-top: 4px; position: relative; display: flex; flex-direction: column;">

    <div style="position: relative; flex-grow: 1; padding: 26px 22px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: repeating-linear-gradient(135deg, #F1EADC 0px, #F1EADC 10px, #EAE1CE 10px, #EAE1CE 20px); border: 4px solid #2B2B2B; border-radius: 40px 12px 36px 14px / 14px 36px 12px 40px; transform: rotate(-1deg);">

      <div style="position: absolute; top: -20px; left: 24px; width: 168px; height: 42px; background: rgba(255, 228, 92, 0.8); transform: rotate(-3deg);"></div>

      <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="8" y="8" width="48" height="48" rx="10" fill="#FBF8F1" stroke="#2B2B2B" stroke-width="4"></rect><path d="M32 22v16M32 44v2" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1.2; text-align: center;">Your word is face down</div>
      <div style="font-size: 18px; font-weight: 700; line-height: 1.35; text-align: center; color: #555555;">Press and hold the card to peek. Let go and it flips right back.</div>

      <div style="margin-top: 6px; display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: #2B2B2B; color: #FBF8F1; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 17px; font-weight: 700;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V7a3 3 0 0 1 6 0v4.5"></path><path d="M7 11.5h10l1 8a3 3 0 0 1-3 3.5H9a3 3 0 0 1-3-3.5z"></path></svg>
        <div>Hold to peek</div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="50" height="50" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"></circle><circle cx="53" cy="59" r="6" fill="#2B2B2B"></circle></svg>
    <div style="font-size: 21px; font-weight: 700;">Priya (you)</div>
  </div>

</div>
</x-dc>
</body>
</html>
