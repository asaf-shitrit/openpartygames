<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 28px; line-height: 1.1;">Doodle Bluff</div>
      <div style="font-size: 17px; font-weight: 700; color: #4A4A4A;">Drawing 3 of 6</div>
    </div>
    <div style="width: 78px; height: 78px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="78" height="78" viewBox="0 0 78 78" style="position: absolute; left: 0; top: 0;"><path d="M40 5c19 1 33 15 33 34 0 19-15 34-35 33C19 71 5 57 6 38 7 20 22 5 42 6" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"></path></svg>
      <div style="position: relative; font-size: 22px; font-weight: 700;">0:14</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 14px;">
    <div style="width: 140px; height: 140px; box-sizing: border-box; flex-shrink: 0; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-0.8deg);">
      <svg width="140" height="140" viewBox="0 0 300 300">
        <path d="M42 234c66-14 130-9 210-16" fill="none" stroke="#2F6FB5" stroke-width="9" stroke-linecap="round"></path>
        <circle cx="68" cy="243" r="11" fill="#2B2B2B"></circle>
        <circle cx="228" cy="228" r="11" fill="#2B2B2B"></circle>
        <path d="M108 205c-14-32 8-63 47-66c37-3 62 20 57 54c-4 26-29 41-58 40c-28-1-50-14-46-28z" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M164 96c-6-20 12-34 30-30c17 4 24 22 14 36c-9 13-28 15-38 5" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 26px; line-height: 1.15;">Which title is real?</div>
      <div style="font-size: 16px; font-weight: 400; line-height: 1.35; color: #555555;">Pick one. Not your own.</div>
    </div>
  </div>

  <div style="position: relative; height: 360px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 19px; font-weight: 700;">a dog on a scooter</div>
      <div style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px 22px 10px 26px / 26px 10px 22px 12px; font-size: 19px; font-weight: 700;">a squirrel driving a bus</div>
      <div style="height: 52px; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #FFF6BF; border: 4px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 19px; font-weight: 700;">
        <div>a hamster in a shopping trolley</div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D7372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </div>
      <div style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px 22px 10px 26px / 26px 10px 22px 12px; font-size: 19px; font-weight: 700;">a duck on a unicycle</div>
      <div style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 19px; font-weight: 700;">a raccoon on rollerskates</div>
      <div style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px 22px 10px 26px / 26px 10px 22px 12px; font-size: 19px; font-weight: 700;">a cat riding a skateboard</div>
      <div style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 26px 10px 22px 12px / 12px 26px 10px 30px; font-size: 19px; font-weight: 700;">a possum stealing a pizza</div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(rgba(251, 248, 241, 0), #FBF8F1); pointer-events: none;"></div>
    <div style="position: absolute; right: 4px; bottom: 2px; display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; color: #8A8A8A;">
      <div>more</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>

  <div style="margin-top: auto; height: 60px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2B2B2B; color: #FBF8F1; border-radius: 26px 10px 22px 12px / 12px 22px 10px 26px; font-size: 21px; font-weight: 700;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
    <div>Lock in</div>
  </div>

</div>
</x-dc>
</body>
</html>
