        <div style="display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 700; color: #2E7D46;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2E7D46" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>

      <div style="width: 250px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px; transform: rotate(-0.6deg);">

        <div style="font-size: 32px; font-weight: 700;">Noa</div>
        <div style="font-size: 28px; font-weight: 700; color: #555555;">Drawing 1 of 2</div>
      </div>

      <div style="width: 250px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px; background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px; transform: rotate(0.8deg);">

          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2E7D46" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
