<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; }
    a { color: #2B2B2B; } a:hover { color: #D7372B; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background-color: #FBF8F1; background-image: linear-gradient(#E4ECF6 2px, transparent 2px), linear-gradient(90deg, #E4ECF6 2px, transparent 2px); background-size: 32px 32px; font-family: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif; color: #2B2B2B;">

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <div style="font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1.1;">Imposter</div>
    <div style="font-size: 17px; font-weight: 700; color: #4A4A4A;">Word 4 of 6 in progress</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px;">
    <div style="position: relative; padding: 0 10px;">
      <div style="position: absolute; left: 0; right: 0; top: 48%; height: 44%; background: #FFE45C; border-radius: 8px; transform: rotate(-2deg);"></div>
      <div style="position: relative; font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; font-size: 38px; line-height: 1.15;">You're in, Ava!</div>
    </div>

  </div>

  <div style="margin: 0 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: #FFE45C; box-shadow: 0 6px 12px rgba(43, 43, 43, 0.14); transform: rotate(-1.5deg);">
    <div style="font-size: 20px; font-weight: 700; line-height: 1.3; text-wrap: pretty;">A game is already running. You'll join when the next one starts.</div>
    <div style="font-size: 18px; font-weight: 400; line-height: 1.3;">Watch the TV in the meantime.</div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 19px; font-weight: 700;">Who's playing (6)</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
        <svg width="48" height="48" viewBox="0 0 100 100"><path d="M50 8c24 0 40 18 40 42s-14 42-40 42S10 74 10 50 26 8 50 8z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="46" r="5" fill="#2B2B2B"></circle><circle cx="62" cy="46" r="5" fill="#2B2B2B"></circle><path d="M37 62q13 12 26 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
        <div style="font-size: 17px; font-weight: 700;">Maya</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
        <svg width="48" height="48" viewBox="0 0 100 100"><path d="M22 30c0-14 12-20 28-20s28 6 28 20c0 4-3 7-6 8v44c0 5-3 8-8 8H36c-5 0-8-3-8-8V38c-3-1-6-4-6-8z" fill="#FFBE7A" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="41" cy="55" r="4.5" fill="#2B2B2B"></circle><circle cx="59" cy="55" r="4.5" fill="#2B2B2B"></circle><path d="M33 44l10 4M67 44l-10 4M44 71h12" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path></svg>
        <div style="font-size: 17px; font-weight: 700;">Dov</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
        <svg width="48" height="48" viewBox="0 0 100 100"><path d="M50 6c6 10 34 30 34 56 0 18-15 30-34 30S16 80 16 62C16 36 44 16 50 6z" fill="#93E3C9" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="58" r="13" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5"></circle><circle cx="53" cy="59" r="5.5" fill="#2B2B2B"></circle></svg>
        <div style="font-size: 17px; font-weight: 700;">Priya</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
        <svg width="48" height="48" viewBox="0 0 100 100"><path d="M28 84c-12 0-20-8-20-19 0-10 7-17 16-18 1-15 12-27 27-27 12 0 22 8 25 19 10 1 18 9 18 20 0 14-9 25-22 25z" fill="#A3CCFF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><path d="M35 60q6 5 12 0M57 60q6 5 12 0" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"></path><circle cx="52" cy="72" r="4" fill="#2B2B2B"></circle></svg>
        <div style="font-size: 17px; font-weight: 700;">Sam</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 30px 10px 26px 12px / 12px 26px 10px 30px;">
        <svg width="48" height="48" viewBox="0 0 100 100"><path d="M50 8l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z" fill="#FFE45C" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="43" cy="50" r="4" fill="#2B2B2B"></circle><circle cx="57" cy="50" r="4" fill="#2B2B2B"></circle><path d="M44 59q6 9 12 0z" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"></path></svg>
        <div style="font-size: 17px; font-weight: 700;">Noa</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px 30px 10px 26px / 26px 10px 30px 12px;">
        <svg width="48" height="48" viewBox="0 0 100 100"><path d="M20 36L18 10l20 14c4-1 8-2 12-2s8 1 12 2l20-14-2 26c6 7 10 16 10 26 0 20-18 30-40 30S10 82 10 62c0-10 4-19 10-26z" fill="#CDB8FF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round"></path><circle cx="38" cy="58" r="4.5" fill="#2B2B2B"></circle><circle cx="62" cy="58" r="4.5" fill="#2B2B2B"></circle><path d="M44 70l6 5 6-5" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div style="font-size: 17px; font-weight: 700;">Leo</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
